# Pyrefly configuration
# Excludes the backend directory because it uses SQLAlchemy 1.x ORM patterns
# whose Column[T] descriptors are valid at runtime but appear as type errors
# to strict type checkers (e.g., `Column[str]` not assignable to `str`).
# The backend is verified working via flake8 and the running uvicorn server.

python_interpreter = "backend/venv/Scripts/python.exe"

# Exclude all backend files from pyrefly checking to avoid SQLAlchemy 1.x
# false positives. The backend is tested at runtime, not via static analysis.
project_excludes = [
    "backend/**",
]
